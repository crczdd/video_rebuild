limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 256k;

    location = /healthz {
        proxy_pass http://app:8000/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://app:8000/readyz;
        proxy_set_header Host $host;
    }

    location = /api/v1/video-remake/generate {
        limit_req zone=webhook_limit burst=3 nodelay;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 145s;
        proxy_read_timeout 145s;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
