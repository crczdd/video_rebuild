limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 256k;
    error_page 413 = @json_413;
    error_page 429 = @json_429;
    error_page 502 = @json_502;
    error_page 504 = @json_504;

    location @json_413 {
        default_type application/json;
        return 413 '{"code":41300,"message":"请求Body超过256KB限制","data":null}';
    }

    location @json_429 {
        default_type application/json;
        return 429 '{"code":42900,"message":"请求过于频繁，请稍后重试","data":null}';
    }

    location @json_502 {
        default_type application/json;
        return 502 '{"code":50200,"message":"应用服务暂时不可用","data":null}';
    }

    location @json_504 {
        default_type application/json;
        return 504 '{"code":50400,"message":"请求处理超过145秒","data":null}';
    }

    location = /healthz {
        proxy_pass http://app:8000/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://app:8000/readyz;
        proxy_set_header Host $host;
    }

    location = /api/v1/video-remake/generate {
        limit_req zone=webhook_limit burst=3 nodelay;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 145s;
        proxy_read_timeout 145s;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
